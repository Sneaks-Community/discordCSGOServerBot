services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: discordserverbot:latest
    container_name: discordserverbot
    # Security
    security_opt:
      - "apparmor=docker-default"
      - "no-new-privileges=true"
    # Drop all container capabilities
    cap_drop:
      - ALL
    read_only: true
    # For SQLite temp directory
    tmpfs:
      - /tmp:size=32m
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/db.sqlite
    volumes:
      - ./servers.json:/app/servers.json:ro
      # Persist SQLite database
      - bot-data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

volumes:
  bot-data:
    driver: local