services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: discord-csgo-bot:latest
    container_name: discord-server-bot
    # Security
    security_opt:
      - "apparmor=docker-default"
      - "no-new-privileges=true"
    # Drop all container capabilities
    cap_drop:
      - ALL
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/db.sqlite
    volumes:
      - ./servers.json:/app/servers.json:ro
      # Persist SQLite database
      - bot-data:/app/data
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
    driver: local